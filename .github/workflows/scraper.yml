name: Scrape internships

on:
  schedule:
    # Every 6 hours. Cron is UTC. Greenhouse-hosted boards update at most
    # a few times a day, so this is frequent enough to stay current
    # without hammering their API or burning GitHub Actions minutes.
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

# Avoid two runs writing to the production DB at the same time (e.g. a
# manual trigger overlapping a scheduled one).
concurrency:
  group: scraper
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Was 15 - measured at ~12-13 min for 40 sequential companies (Phase
    # 10 Step 4); adding 8 more in Step 5 pushed a real run over 15 min
    # and it was hard-canceled by the platform mid-run (2026-08-26,
    # run 32914271497). Each company's run() commits in a single
    # transaction at the end (see scrapers/base_scraper.py), so a
    # mid-run cancellation only loses that cycle's update for whichever
    # company was in flight - it cannot partially write or deactivate
    # data - but every scraper after the cut-off point simply never
    # runs that cycle. 40 minutes gives headroom for further company
    # growth before this needs revisiting again; if the run
    # consistently approaches this limit, the real fix is parallelizing
    # scrapers (a matrix job or threaded scheduler), not just raising
    # the number again.
    timeout-minutes: 40
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      NOTIFICATIONS_FROM_EMAIL: ${{ secrets.NOTIFICATIONS_FROM_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run scrapers
        run: python -m scrapers.scheduler

      - name: Process notifications
        # Runs regardless of the scraper step's own per-listing errors
        # (it already isolates and reports those itself - see
        # scrapers/scheduler.py) - a notification run is still valid and
        # idempotent even if e.g. one company's scraper failed outright.
        # Never touches Clerk (no auth verification happens here, only
        # reading users/preferences already in Postgres and sending
        # email) so CLERK_* secrets aren't needed by this job.
        if: always()
        run: python -m backend.services.notifications
